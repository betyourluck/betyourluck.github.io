        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
       * { box-sizing: border-box; }
        html, body { margin:0; padding:0; background:#05050a; overflow:hidden; max-width:100vw; width:100%; }
        .cyber-wrapper {
          position: fixed;
          inset:0;
          width: 100%;
          max-width: 100vw;
          height: 100vh;
          max-height: 100vh;
          overflow: hidden;
          background: #05050a;
          font-family: 'Courier New', 'Share Tech Mono', monospace;
          color: #00ff9d;
        }
        #canvas-container {
          position: absolute;
          inset:0;
          width:100%;
          height:100%;
          max-width:100vw;
          max-height:100vh;
          overflow:hidden;
        }
        #canvas-container canvas { display:block; width:100% !important; height:100% !important; max-width:100vw; max-height:100vh; }

        /* --- CRTレイヤー --- */
        .scanlines {
          position: absolute;
          inset:0;
          pointer-events: none;
          z-index: 5;
          background: repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0) 0px,
            rgba(0,0,0,0) 2px,
            rgba(0,255,157,0.035) 2px,
            rgba(0,0,0,0) 3px
          );
          animation: scanMove 8s linear infinite;
        }
        @keyframes scanMove {
          0% { transform: translateY(0); }
          100% { transform: translateY(8px); }
        }
        .vignette {
          position: absolute;
          inset:0;
          pointer-events: none;
          z-index: 6;
          background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 85%, rgba(0,0,0,0.85) 100%);
        }
       .noise {
         position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          max-width: 100vw;
          max-height: 100vh;
          pointer-events: none;
          z-index: 7;
          opacity: 0.035;
          background-image: 
            repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 2px),
            repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 3px);
          background-size: 3px 3px, 4px 4px;
          animation: noiseFlicker 0.15s steps(2) infinite, noiseShift 0.6s linear infinite;
          mix-blend-mode: screen;
          overflow: hidden;
        }
        @keyframes noiseFlicker {
          0% { opacity: 0.02; }
          50% { opacity: 0.05; }
          100% { opacity: 0.03; }
        }
        @keyframes noiseShift {
          0% { transform: translate(0,0); }
          25% { transform: translate(-1%, 1%); }
          50% { transform: translate(1%, -1%); }
          75% { transform: translate(-0.5%, -0.5%); }
          100% { transform: translate(0,0); }
        }

        .webgl-error {
          position: absolute;
          top:50%; left:50%;
          transform: translate(-50%,-50%);
          z-index: 100;
          background: rgba(0,0,0,0.9);
          border: 1px solid #ff00a0;
          color: #ff00a0;
          padding: 24px 32px;
          font-size: 14px;
          letter-spacing: 0.1em;
        }

        /* --- HUD全体 --- */
        .hud-overlay {
          position: absolute;
          inset:0;
          pointer-events: none;
          z-index: 10;
          overflow: hidden;
        }

        /* コーナーブラケット 20px L字 発光 */
        .corner {
          position: absolute;
          width: 26px;
          height: 26px;
          border-color: #00ff9d;
          filter: drop-shadow(0 0 6px #00ff9d) drop-shadow(0 0 12px rgba(0,255,157,0.5));
        }
        .corner.tl { top:18px; left:18px; border-top: 2px solid #00ff9d; border-left: 2px solid #00ff9d; }
        .corner.tr { top:18px; right:18px; border-top: 2px solid #00f0ff; border-right: 2px solid #00f0ff; filter: drop-shadow(0 0 6px #00f0ff); }
        .corner.bl { bottom:18px; left:18px; border-bottom: 2px solid #00f0ff; border-left: 2px solid #00f0ff; filter: drop-shadow(0 0 6px #00f0ff); }
        .corner.br { bottom:18px; right:18px; border-bottom: 2px solid #ff00a0; border-right: 2px solid #ff00a0; filter: drop-shadow(0 0 6px #ff00a0); }

        /* ステータスバー */
        .status-bar {
          position: absolute;
          top: 20px;
          left: 60px;
          right: 60px;
          height: 28px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid rgba(0,255,157,0.25);
          background: linear-gradient(90deg, rgba(0,255,157,0.06), transparent 60%);
          padding: 0 12px;
          font-size: 11px;
          letter-spacing: 0.08em;
          color: #00ff9d;
          text-shadow: 0 0 8px rgba(0,255,157,0.6);
        }
        .status-left, .status-right { display:flex; align-items:center; gap:8px; }
        .status-text { color:#00ff9d; font-weight:700; }
        .sep { opacity:0.3; margin:0 4px; }
        .blink-dot {
          width:7px; height:7px; border-radius:50%;
          background:#00ff9d;
          box-shadow: 0 0 8px #00ff9d, 0 0 16px #00ff9d;
          animation: blink 1s steps(2) infinite;
        }
        @keyframes blink { 0%{opacity:1} 50%{opacity:0.2} }
        .fps { color:#00f0ff; }
        .date-text { color: rgba(255,255,255,0.7); }

        /* 中央タイトル */
        .center-title {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -60%);
          text-align: center;
          width: 90%;
          max-width: 680px;
        }
        .deco-line {
          height:1px;
          background: linear-gradient(90deg, transparent, #00ff9d 15%, #00f0ff 50%, #ff00a0 85%, transparent);
          opacity:0.8;
          box-shadow: 0 0 8px rgba(0,255,157,0.6);
        }
        .deco-line.top { margin-bottom:18px; animation: linePulse 3s ease-in-out infinite; }
        .deco-line.bottom { margin-top:18px; animation: linePulse 3s ease-in-out infinite reverse; }
        @keyframes linePulse { 0%,100%{opacity:0.6} 50%{opacity:1} }

        .main-title {
					display: inline-block;
					max-width: 100%;
					font-size: clamp(32px, 5.2vw, 62px);
          font-weight: 900;
					letter-spacing: 0.14em;
          margin:0;
          color: #eafff6;
          text-shadow:
            0 0 10px rgba(0,255,157,0.8),
            0 0 24px rgba(0,255,157,0.5),
            0 0 48px rgba(0,240,255,0.4),
            2px 0 0 rgba(255,0,160,0.15),
            -2px 0 0 rgba(0,240,255,0.15);
          line-height: 0.9;
        }
        /* 軽いグリッチアニメーション */
        .glitch-text {
          position: relative;
          animation: subtleGlitch 4s infinite;
        }
        @keyframes subtleGlitch {
          0%, 90%, 100% { transform: translate(0); filter: none; }
          91% { transform: translate(-1px, 0); text-shadow: 2px 0 #ff00a0, -2px 0 #00f0ff; }
          92% { transform: translate(1px, -1px); }
          93% { transform: translate(0); }
        }
        .cyber-wrapper.glitch-active .main-title {
          animation: heavyGlitch 0.16s steps(2) 2;
        }
        @keyframes heavyGlitch {
          0% { transform: translate(0); clip-path: inset(0 0 0 0); }
          20% { transform: translate(-3px,1px); clip-path: inset(20% 0 30% 0); text-shadow: 3px 0 #ff00a0; }
          40% { transform: translate(3px,-1px); clip-path: inset(50% 0 10% 0); text-shadow: -3px 0 #00f0ff; }
          60% { transform: translate(-1px,0); clip-path: inset(10% 0 60% 0); }
          80% { transform: translate(2px,1px); }
          100% { transform: translate(0); }
        }

        .sub-titles {
          margin-top: 12px;
          display:flex;
          justify-content:center;
          align-items:center;
          gap:12px;
          font-size: 11px;
          letter-spacing: 0.28em;
          color: #00f0ff;
          text-shadow: 0 0 10px rgba(0,240,255,0.8);
        }
        .sub-core { color:#00ff9d; font-weight:700; }
        .sub-dot { color:#ff00a0; animation: blink 0.8s infinite; }
        .title-meta {
          margin-top: 16px;
          display:flex;
          justify-content:center;
          align-items:center;
          gap:10px;
          font-size:9px;
          letter-spacing:0.2em;
          color: rgba(255,255,255,0.55);
        }
        .meta-line { width:40px; height:1px; background: rgba(255,255,255,0.25); }

        /* レーダー */
        .radar-wrap {
          position: absolute;
          top: 68px;
          right: 24px;
          width: 132px;
          display:flex;
          flex-direction: column;
          align-items:center;
          gap:8px;
        }
        .radar {
          width: 96px;
          height: 96px;
          border-radius: 50%;
          border: 1px solid rgba(0,240,255,0.35);
          position: relative;
          background: radial-gradient(circle, rgba(0,240,255,0.08) 0%, rgba(0,0,0,0) 70%);
          box-shadow: inset 0 0 20px rgba(0,240,255,0.15), 0 0 18px rgba(0,240,255,0.12);
          overflow:hidden;
        }
        .radar-circle {
          position:absolute;
          border:1px solid rgba(0,240,255,0.15);
          border-radius:50%;
          top:50%; left:50%;
          transform: translate(-50%,-50%);
        }
        .radar-circle.c1 { width:32px; height:32px; }
        .radar-circle.c2 { width:60px; height:60px; }
        .radar-circle.c3 { width:86px; height:86px; }
        .radar-sweep {
          position:absolute;
          width:50%; height:50%;
          top:50%; left:50%;
          transform-origin: 0% 0%;
          background: conic-gradient(from 0deg, rgba(0,255,157,0.35) 0deg, transparent 70deg);
          animation: radarRotate 3s linear infinite;
        }
        @keyframes radarRotate { to { transform: rotate(360deg); } }
        .radar-center { position:absolute; top:50%; left:50%; width:4px; height:4px; background:#00ff9d; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 8px #00ff9d; }
        .radar-dot { position:absolute; width:4px; height:4px; border-radius:50%; background:#ff00a0; box-shadow:0 0 6px #ff00a0; }
        .radar-dot.d1 { top:28%; left:64%; animation: dotPulse 2s ease-in-out infinite; }
        .radar-dot.d2 { top:62%; left:28%; animation: dotPulse 2.3s ease-in-out infinite 0.6s; }
        @keyframes dotPulse { 0%,100%{opacity:0.6; transform:scale(1)} 50%{opacity:1; transform:scale(1.4)} }
        .radar-label { font-size:8px; letter-spacing:0.12em; color: rgba(0,240,255,0.8); text-align:center; line-height:1.4; }
        .radar-coord { color: rgba(255,255,255,0.5); font-size:7px; }

        /* パネル共通 */
        .panel {
          position: absolute;
          background: rgba(5,5,15,0.72);
          border: 1px solid rgba(0,255,157,0.22);
          backdrop-filter: blur(6px);
          box-shadow: 0 0 24px rgba(0,0,0,0.6), inset 0 0 12px rgba(0,255,157,0.04);
        }
        .panel-header {
          height:22px;
          display:flex;
          justify-content: space-between;
          align-items:center;
          padding:0 10px;
          font-size:9px;
          letter-spacing:0.14em;
          background: rgba(0,255,157,0.08);
          border-bottom:1px solid rgba(0,255,157,0.18);
          color:#00ff9d;
        }
        .panel-live { color:#ff00a0; animation: blink 1s infinite; font-size:8px; }
        .panel-badge { background:#00f0ff; color:#000; padding:1px 5px; font-weight:800; font-size:8px; }

        /* 左下 sys log */
        .sys-panel {
          bottom: 18px;
          left: 18px;
          width: 360px;
          height: 132px;
        }
        .log-body {
          height: calc(100% - 22px);
          overflow:hidden;
          padding:6px 10px;
          font-size:9.5px;
          line-height:1.55;
          font-family: 'Share Tech Mono', monospace;
        }
        .log-ok { color:#00ff9d; text-shadow:0 0 6px rgba(0,255,157,0.6); }
        .log-sys { color: rgba(255,255,255,0.75); }
        .log-net { color:#00f0ff; text-shadow:0 0 6px rgba(0,240,255,0.5); }
        .log-wrn { color:#ffcc00; text-shadow:0 0 6px rgba(255,204,0,0.5); }

        /* 右下 hex dump */
        .hex-panel {
          bottom: 18px;
          right: 18px;
          width: 320px;
          height: 132px;
        }
        .hex-body {
          height: calc(100% - 22px);
          overflow:hidden;
          padding:6px 10px;
          font-size:9px;
          line-height:1.6;
          color: rgba(0,255,157,0.75);
          letter-spacing:0.06em;
          font-family: 'Share Tech Mono', monospace;
        }
        .hex-line { white-space:nowrap; opacity:0.9; }
        .hex-line:nth-child(odd) { color: rgba(0,240,255,0.7); }

        /* 中央下 throughput */
        .throughput-wrap {
          position: absolute;
          bottom: 22px;
          left: 50%;
          transform: translateX(-50%);
          width: 380px;
          background: rgba(5,5,15,0.7);
          border:1px solid rgba(0,255,157,0.18);
          padding:8px 12px 6px;
          backdrop-filter: blur(4px);
        }
        .throughput-header {
          display:flex;
          justify-content: space-between;
          font-size:9px;
          letter-spacing:0.18em;
          color:#00ff9d;
          margin-bottom:6px;
        }
        .throughput-bar {
          position:relative;
          height:8px;
          background: rgba(0,0,0,0.6);
          border:1px solid rgba(0,255,157,0.2);
          overflow:hidden;
        }
        .throughput-fill {
          height:100%;
          background: linear-gradient(90deg, #00ff9d, #00f0ff 60%, #ff00a0);
          box-shadow: 0 0 10px rgba(0,255,157,0.8);
          transition: width 0.15s ease-out;
          position:relative;
        }
        .throughput-glow {
          position:absolute;
          right:0; top:0; bottom:0;
          width:18px;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8));
          animation: glowSlide 1.2s linear infinite;
        }
        @keyframes glowSlide { 0%{transform:translateX(-20px); opacity:0} 50%{opacity:1} 100%{transform:translateX(20px); opacity:0} }
        .throughput-grid {
          position:absolute;
          inset:0;
          background: repeating-linear-gradient(90deg, transparent 0 8px, rgba(0,255,157,0.12) 8px 9px);
          pointer-events:none;
        }
        .throughput-footer {
          display:flex;
          justify-content: space-between;
          font-size:7.5px;
          letter-spacing:0.1em;
          color: rgba(255,255,255,0.5);
          margin-top:5px;
        }
